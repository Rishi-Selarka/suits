<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Suits AI verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#FAF9EA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;color:#18181B;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FAF9EA;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border:1px solid #ECE9D8;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="padding:32px 40px 0 40px;text-align:left;">
                <div style="display:inline-block;padding:6px 12px;border-radius:999px;background:#FEF6EE;color:#C85A1E;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;">SUITS AI</div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 0 40px;">
                <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.25;font-weight:600;color:#18181B;">Confirm it's you</h1>
                <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#52525B;">
                  Use this verification code to continue. It expires shortly and can only be used once.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px;" align="left">
                <div style="display:inline-block;padding:14px 22px;border-radius:12px;background:#FAF9EA;border:1px solid #ECE9D8;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:28px;letter-spacing:0.18em;color:#18181B;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 32px 40px;">
                <hr style="border:none;border-top:1px solid #ECE9D8;margin:0 0 16px 0;" />
                <p style="margin:0;font-size:12px;line-height:1.6;color:#A1A1AA;">
                  Didn't try to sign in? Ignore this email and consider changing your password.
                </p>
              </td>
            </tr>
          </table>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;margin-top:16px;">
            <tr>
              <td style="padding:0 8px;text-align:center;">
                <p style="margin:0;font-size:11px;line-height:1.6;color:#A1A1AA;">
                  Suits AI · Multi-agent legal analysis for Indian contracts
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
